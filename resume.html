<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">   
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Yuyu&display=swap" rel="stylesheet">  

    <style>
        .resume {
            width: 100%;
            height: 100vh;
            border: none;
            border-radius: 10px;
        }

        .resume-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .view-project:hover {
            transform: scale(1.1);
            transition: transform 0.3s ease;
        }
    </style>
    <title>My Resume</title>
</head>

<body>
    <div id="nav-placeholder"></div>
    <div class="content">
        <div class="resume-buttons">
            <a href="files/MD Yeasin Rahman Khan Resume.pdf" download>
            <button class="view-project">Download Resume</button>
            </a>
            <button class="view-project" onclick="window.open('files/MD Yeasin Rahman Khan Resume.pdf', '_blank')">View Resume</button>
        </div>
    
        <iframe src="files/MD Yeasin Rahman Khan Resume.pdf" title="MD Yeasin Rahman Khan Resume" class="resume"></iframe>

    </div>
    <div id="footer-placeholder"></div>
    <script src="js/theme.js"></script>
    <script src="js/components.js"></script>
</body>
</html>
