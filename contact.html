<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">   
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Yuyu&display=swap" rel="stylesheet">  
    <style>
        .contact-socials {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .socials-indi:hover {
            transform: scale(1.1);
            transition: transform 0.3s ease;
        }
    </style>
    <title>Contact Me</title>
    <link rel="icon" type="image/png" href="img/logo.png">
</head>
<body>
     <div id="nav-placeholder"></div>
     <div class="content" style=" min-height: 100vh; display: grid; place-items: center;">
        <h2>Lets Connect Over Socials!</h2>
        <div class="contact-socials">
            <a href="https://www.linkedin.com/in/md-yeasin-rahman-khan/"><img class="socials-indi" src="img/linkedin-blue.png" alt="Contact Image" style="width: 60px; height: auto; margin-bottom: 20px;"></a>
            <a href="https://github.com/kyeasin31"><img class="socials-indi" src="img/github-white.png" alt="Contact Image" style="width: 60px; height: auto; margin-bottom: 20px;"></a>
        </div>
        <h2>Or Send Me An Email!</h2>

        <form id="contact-form" novalidate style="font-size: 20px;">
            <p style="font-size: 25px; font-weight: bold;">Feel free to reach out to me using the form below. I would love to hear from you!</p>
            <div class ="form-group">
               <label for="name">Name:</label>
               <input type="text" id="name" name="name" required style=" padding: 5px; border-radius: 5px; border: 1px solid #ccc;"><br><br>
               <span class="error-message" id="name-error"></span>
            </div>
            <div class ="form-group">
                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject" required style=" padding: 5px; border-radius: 5px; border: 1px solid #ccc;"><br><br>
                <span class="error-message" id="subject-error"></span>
            </div>
            <div class ="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required style=" padding: 5px; border-radius: 5px; border: 1px solid #ccc;"><br><br>
                <span class="error-message" id="email-error"></span>
            </div>
            <div class ="form-group">
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="5" cols="30" required style=" padding: 10px; border-radius: 5px; border: 1px solid #ccc;"></textarea><br><br>
                <span class="error-message" id="message-error"></span>
            </div>
            <input class="view-project" type="submit" value="Send" style="font-size: 25px">
        </form>

        <div id="form-success" class="success-message" hidden></div>

     </div>

     <div id="footer-placeholder"></div>
     <script src="js/theme.js"></script>
     <script src="js/components.js"></script>
     <script src="js/contact.js"></script>
</body>
</html>
